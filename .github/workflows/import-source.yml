name: Import uploaded game source
on:
  push:
    paths:
      - .github/workflows/import-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand the uploaded source archive
        run: |
          test ! -f package.json || exit 0
          unzip -o order-workshop-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Expand game source, assets and tests"
          git push origin HEAD:main
